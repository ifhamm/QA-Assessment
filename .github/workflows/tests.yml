name: QA Automation Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: "UI regression shards (1 keeps a single job)"
        required: false
        type: number
        default: 1

env:
  # The workflow target is the self-hosted stack, not the shared public demo.
  # Keeping the URL here also prevents a stale repository variable from
  # silently pointing CI back at the public instance.
  BASE_URL: http://localhost:8081
  API_BASE_URL: http://localhost:8081/api

# A new push to the same PR cancels the superseded run; pushes to main are
# never cancelled so the recorded run always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check stage tags
        run: npm run check:tags

  api-tests:
    name: API Tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start self-hosted API
        run: docker compose up -d --build --wait api

      - name: Prepare results directory
        run: mkdir -p test-results

      - name: Run API tests
        run: npm run test:api:local:ci

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: test-results/newman.json
          retention-days: 7
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  plan-shards:
    name: Plan UI Shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}

    steps:
      - name: Build shard matrix
        id: matrix
        env:
          SHARD_COUNT: ${{ github.event.inputs.shards || 1 }}
        run: |
          echo "shards=$(node -e 'console.log(JSON.stringify(Array.from({ length: Number(process.env.SHARD_COUNT) }, (_, i) => i + 1)))')" >> "$GITHUB_OUTPUT"

  ui-smoke:
    name: UI Smoke
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start self-hosted RealWorld stack
        run: npm run stack:up

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/smoke
        run: npm run test:smoke

      - name: Upload smoke blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-smoke
          path: blob-report/smoke
          retention-days: 7
          if-no-files-found: warn

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-smoke
          path: |
            test-results/junit.xml
            test-results/results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload smoke traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: npm run stack:down

  browser-smoke:
    # Cross-browser is a separate job so the Chromium stages keep their
    # timings and the two engines can fail independently.
    name: Browser Smoke (${{ matrix.browser }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start self-hosted RealWorld stack
        run: npm run stack:up

      # The setup project only uses the request fixture; no extra engine is
      # needed for the API-created storage state.
      - name: Run @smoke on ${{ matrix.browser }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/browser-${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}-smoke

      - name: Upload browser blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-browser-${{ matrix.browser }}
          path: blob-report/browser-${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-browser-${{ matrix.browser }}
          path: |
            test-results/junit.xml
            test-results/results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: npm run stack:down

  ui-regression:
    name: UI Regression (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [static, plan-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan-shards.outputs.shards) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start self-hosted RealWorld stack
        run: npm run stack:up

      - name: Run regression tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/regression-${{ matrix.shard }}
        run: npm run test:regression -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload regression blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-regression-${{ matrix.shard }}
          path: blob-report/regression-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-regression-${{ matrix.shard }}
          path: |
            test-results/junit.xml
            test-results/results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload regression traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: npm run stack:down

  visual-tests:
    name: Visual Tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start self-hosted RealWorld stack
        run: npm run stack:up

      # Runs in mcr.microsoft.com/playwright, the same image used to create the
      # baselines. The host runner never renders the screenshots.
      - name: Run visual tests
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/visual
        run: npm run test:visual:linux

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            blob-report/visual/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-visual
          path: blob-report/visual
          retention-days: 7
          if-no-files-found: warn

      - name: Upload visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-visual
          path: |
            test-results/junit.xml
            test-results/results.json
          retention-days: 7
          if-no-files-found: warn

      - name: Stop stack
        if: always()
        run: docker compose --profile visual down -v --remove-orphans

  report:
    name: Merged Report
    needs: [api-tests, ui-smoke, ui-regression, visual-tests, browser-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
        continue-on-error: true

      - name: Flatten blob reports
        run: |
          mkdir -p merged-blobs
          i=0
          find all-blob-reports -name '*.zip' -print0 2>/dev/null |
            while IFS= read -r -d '' file; do
              i=$((i + 1))
              artifact=$(basename "$(dirname "$file")")
              cp "$file" "merged-blobs/$artifact-$i.zip"
            done
          ls -l merged-blobs

      - name: Merge reports
        if: ${{ hashFiles('merged-blobs/*.zip') != '' }}
        # Reporters (HTML, JUnit, JSON) live in playwright.merge.config.ts.
        run: npx playwright merge-reports -c playwright.merge.config.ts merged-blobs

      - name: Verify merged report
        run: test -f playwright-report/index.html

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-results
          path: |
            test-results/merged.json
            test-results/merged-junit.xml
          retention-days: 7
          if-no-files-found: warn

  quality-gate:
    name: Quality Gate
    needs: [static, api-tests, ui-smoke, ui-regression, visual-tests, browser-smoke, report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download merged results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: merged-results
          path: gate-results/merged

      - name: Download API results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: api-results
          path: gate-results/api

      - name: Download stage results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: gate-results/stages

      - name: Build summary and evaluate gates
        env:
          GATE_RESULTS: static=${{ needs.static.result }},api=${{ needs['api-tests'].result }},smoke=${{ needs['ui-smoke'].result }},regression=${{ needs['ui-regression'].result }},visual=${{ needs['visual-tests'].result }},browser=${{ needs['browser-smoke'].result }},report=${{ needs.report.result }}
        run: |
          node scripts/ci-summary.mjs \
            --playwright gate-results/merged/merged.json \
            --newman gate-results/api/newman.json \
            --stages-dir gate-results/stages \
            --gates "$GATE_RESULTS" \
            --out summary.md

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.md
          retention-days: 7
          if-no-files-found: warn
