name: QA Automation Tests

on:
  push:
  pull_request:

env:
  # The workflow target is the self-hosted stack, not the shared public demo.
  # Keeping the URL here also prevents a stale repository variable from
  # silently pointing CI back at the public instance.
  BASE_URL: http://localhost:8081
  API_BASE_URL: http://localhost:8081/api

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start self-hosted API
        run: docker compose up -d --build --wait api

      - name: Run API tests
        run: npm run test:api:local

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Start self-hosted RealWorld stack
        run: npm run stack:up

      - name: Run UI tests
        run: npm run test:ui

      - name: Run cross-layer tests
        run: npm run test:cross

      - name: Stop stack
        if: always()
        run: npm run stack:down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-tests:
    name: Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start self-hosted RealWorld stack
        run: npm run stack:up

      # Runs in mcr.microsoft.com/playwright, the same image used to create the
      # baselines. The host runner never renders the screenshots.
      - name: Run visual tests
        run: npm run test:visual:linux

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose --profile visual down -v --remove-orphans
