version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      playwright-tooling:
        patterns:
          - "@playwright/test"
          - "eslint"
          - "@types/node"
          - "typescript"
          - "@typescript/native"
          - "typescript-eslint"
      testing-tools:
        patterns:
          - "newman"
          - "cross-env"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/performance"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
