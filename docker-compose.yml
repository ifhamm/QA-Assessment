# WP4's stable target: the same Angular RealWorld UI and a spec-compliant API,
# both local. Use `npm run stack:up` and `npm run test:local`.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: file:/app/dev.db
      JWT_SECRET: wp4-local-test-secret-not-for-production
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/tags').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_BASE: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The only environment allowed to produce or compare visual baselines.
  # The image tag must match the @playwright/test version in package-lock.json;
  # tests reach the app through the compose network, not through localhost.
  visual:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["visual"]
    depends_on:
      web:
        condition: service_healthy
    working_dir: /work
    volumes:
      - .:/work
    environment:
      BASE_URL: http://web
      API_BASE_URL: http://web/api
      TZ: UTC
      # Empty locally so the visual run keeps its HTML report; CI sets a
      # per-job directory so the result can join the merged report.
      PLAYWRIGHT_BLOB_OUTPUT_DIR: ${PLAYWRIGHT_BLOB_OUTPUT_DIR:-}
    command:
      [
        "node",
        "node_modules/@playwright/test/cli.js",
        "test",
        "--project=visual",
      ]
